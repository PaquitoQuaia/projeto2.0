<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro | Truck Parts</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/cadastro.css') }}"
    />
  </head>

  <body>
    <div class="formulario">
      <div class="topo">
        <h1>Truck Parts</h1>

        <p>Crie sua conta</p>
      </div>

      <form action="{{ url_for('fazer_cadastro') }}" method="post">
        <div class="grupo">
          <label for="nome"> Nome completo </label>

          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            autocomplete="name"
            required
          />
        </div>

        <div class="linha">
          <div class="grupo">
            <label for="data_nascimento"> Data de nascimento </label>

            <input
              type="date"
              id="data_nascimento"
              name="data_nascimento"
              required
            />
          </div>

          <div class="grupo">
            <label for="cpf"> CPF </label>

            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="000.000.000-00"
              maxlength="14"
              required
            />
          </div>
        </div>

        <div class="linha">
          <div class="grupo">
            <label for="telefone"> Telefone </label>

            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="11999999999"
              required
            />
          </div>

          <div class="grupo">
            <label for="email"> E-mail </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="seuemail@email.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="linha">
          <div class="grupo">
            <label for="cep"> CEP </label>

            <input
              type="text"
              id="cep"
              name="cep"
              placeholder="00000000"
              maxlength="9"
              required
            />
          </div>

          <div class="grupo">
            <label for="numero"> Número </label>

            <input
              type="text"
              id="numero"
              name="numero"
              placeholder="Número"
              required
            />
          </div>
        </div>

        <div class="grupo">
          <label for="complemento"> Complemento </label>

          <input
            type="text"
            id="complemento"
            name="complemento"
            placeholder="Apartamento, bloco..."
          />
        </div>

        <div class="grupo">
          <label> Tipo de cadastro </label>

          <div class="opcoes">
            <label class="opcao">
              <input
                type="radio"
                name="tipo_cadastro"
                value="pessoa_fisica"
                required
              />

              Pessoa Física
            </label>

            <label class="opcao">
              <input
                type="radio"
                name="tipo_cadastro"
                value="pessoa_juridica"
              />

              Pessoa Jurídica
            </label>

            <label class="opcao">
              <input type="radio" name="tipo_cadastro" value="revendedor" />

              Revendedor
            </label>
          </div>
        </div>

        <div class="grupo">
          <label> Áreas de interesse </label>

          <div class="opcoes">
            <label class="opcao">
              <input type="checkbox" name="interesses" value="Mecânica" />

              Mecânica
            </label>

            <label class="opcao">
              <input type="checkbox" name="interesses" value="Elétrica" />

              Elétrica
            </label>

            <label class="opcao">
              <input type="checkbox" name="interesses" value="Acessórios" />

              Acessórios
            </label>

            <label class="opcao">
              <input type="checkbox" name="interesses" value="Pneus" />

              Pneus
            </label>
          </div>
        </div>

        <div class="grupo">
          <label for="senha"> Senha </label>

          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Mínimo 6 caracteres"
            minlength="6"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="grupo">
          <label for="confirmar_senha"> Confirmar senha </label>

          <input
            type="password"
            id="confirmar_senha"
            name="confirmar_senha"
            placeholder="Digite novamente"
            minlength="6"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit">Criar minha conta</button>

        <a href="{{ url_for('login') }}" class="login"> Já tenho uma conta </a>
      </form>
    </div>
  </body>
</html>
